# Robocop theme — a warm, professional light palette inspired by the Claude
# Code aesthetic (cream/paper background, coral accent, clean type).
[theme]
base = "light"
primaryColor = "#d97757"            # Claude coral accent
backgroundColor = "#faf9f5"         # warm paper canvas
secondaryBackgroundColor = "#f0eee6" # cards / sidebar / inputs
textColor = "#28261d"               # warm near-black ink
linkColor = "#c15f3c"
codeBackgroundColor = "#f0eee6"
borderColor = "#dcd8cc"
showWidgetBorder = true
baseRadius = "0.6rem"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"

[server]
runOnSave = true

[client]
toolbarMode = "minimal"
